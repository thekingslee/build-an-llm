[project]
name = "build-an-llm"
version = "0.1.0"
description = "Monorepo: GPT1 training, PDF/web scraping, and data refinement"
readme = "GPT1-Project/README.md"
requires-python = ">=3.10"
dependencies = [
    "accelerate>=1.13.0",
    "beautifulsoup4>=4.12.0",
    "datasets>=4.8.3",
    "ipykernel>=6.29.0",
    "lingua-language-detector>=2.0.0",
    "nltk>=3.9",
    "pdfplumber>=0.11.0",
    "pillow>=10.0.0",
    "pymupdf>=1.24.0",
    "pytesseract>=0.3.10",
    "requests>=2.31.0",
    "torch>=2.10.0",
    "tqdm>=4.67.3",
    "transformers>=5.3.0",
    "wandb>=0.25.1",
    "torchvision",
    "torchaudio",
]

[tool.pyright]
extraPaths = ["GPT1-Project"]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchvision = { index = "pytorch-cu121" }
torchaudio = { index = "pytorch-cu121" }
